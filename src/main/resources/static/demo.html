<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工牌 · 演示控制台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
    background: #0b1622; color: #e8eef5; font-size: 14px; line-height: 1.6;
  }
  .topbar { background: #0f2130; padding: 14px 24px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid #1e3548; }
  .topbar .brand { font-size: 18px; font-weight: 700; }
  .topbar .brand small { display: block; font-size: 12px; color: #7b93a8; font-weight: 400; }
  .industry-tabs { display: flex; gap: 8px; margin-left: auto; }
  .industry-tabs button { padding: 8px 18px; font-size: 14px; font-weight: 600; border: 1px solid #2a4a63; background: transparent; color: #9fb3c8; border-radius: 20px; cursor: pointer; }
  .industry-tabs button.active { background: #2e6da4; color: #fff; border-color: #2e6da4; }

  .sub-tabs { display: none; background: #0f2130; padding: 8px 24px; border-bottom: 1px solid #1e3548; gap: 8px; }
  .sub-tabs.visible { display: flex; }
  .sub-tabs button { padding: 5px 14px; font-size: 13px; font-weight: 600; border: 1px solid #2a4a63; background: transparent; color: #9fb3c8; border-radius: 16px; cursor: pointer; }
  .sub-tabs button.active { background: #1a7f37; color: #fff; border-color: #1a7f37; }

  .layout { display: flex; min-height: calc(100vh - 58px); }
  .script-panel { width: 42%; padding: 20px; border-right: 1px solid #1e3548; overflow-y: auto; }
  .dashboard-panel { flex: 1; padding: 20px; overflow-y: auto; }

  .step { background: #0f2130; border: 1px solid #1e3548; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; transition: all .15s; }
  .step:hover { border-color: #2e6da4; }
  .step.active { border-color: #2e6da4; background: #122a3d; }
  .step .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .step .tag { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .step:nth-child(1) .tag { background: #2e6da4; }
  .step:nth-child(2) .tag { background: #1a7f37; }
  .step:nth-child(3) .tag { background: #b8860b; }
  .step:nth-child(4) .tag { background: #7b4db8; }
  .step:nth-child(5) .tag { background: #c62828; }
  .step:nth-child(6) .tag { background: #0e7490; }
  .step .title { font-size: 15px; font-weight: 700; }
  .step .value { font-size: 12px; color: #7b93a8; }
  .step .body { display: none; margin-top: 8px; border-top: 1px dashed #1e3548; padding-top: 8px; }
  .step.active .body { display: block; }
  .step .body .demo { color: #6ee7b7; margin-bottom: 4px; }
  .step .body .talk { color: #cbd8e4; font-size: 13px; }

  .panel-title { font-size: 13px; color: #7b93a8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .card { background: #0f2130; border: 1px solid #1e3548; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h3 { font-size: 14px; color: #9fb3c8; margin-bottom: 10px; }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar-row .lbl { width: 46px; font-size: 13px; color: #cbd8e4; }
  .bar-row .bar { flex: 1; height: 18px; background: #16293a; border-radius: 9px; overflow: hidden; }
  .bar-row .bar .fill { height: 100%; background: #2e6da4; border-radius: 9px; }
  .bar-row .pct { width: 40px; text-align: right; font-size: 13px; color: #7b93a8; }

  .faq-list { list-style: none; }
  .faq-list li { padding: 8px 0; border-bottom: 1px dashed #1e3548; }
  .faq-list li:last-child { border-bottom: none; }
  .faq-list .q { color: #e8eef5; font-weight: 600; }
  .faq-list .a { color: #9fb3c8; font-size: 13px; margin-top: 2px; }
  .faq-list .src { color: #5b7188; font-size: 11px; margin-top: 2px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
  .tag.hit { background: #1a7f37; color: #fff; }
  .tag.miss { background: #c62828; color: #fff; }

  .story-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .story { background: #122a3d; border: 1px solid #1e3548; border-radius: 8px; padding: 12px; }
  .story .k { font-size: 13px; color: #6ee7b7; font-weight: 600; margin-bottom: 4px; }
  .story .v { font-size: 12px; color: #cbd8e4; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #16293a; border: 1px solid #1e3548; border-radius: 12px; padding: 3px 10px; font-size: 12px; color: #9fb3c8; }
  .hint { font-size: 12px; color: #7b93a8; margin-top: 6px; }
</style>
</head>

<div class="layout">

  </div>
  <div class="dashboard-panel">
    <div class="panel-title">后台大屏 · 数据看板</div>
    <div id="dashboard"></div>
  </div>
</div>

  var current = 'hotel';

  var activeStep = 0;
  var customerId = 1, storeId = 1;

  function switchIndustry(key) {
    current = key;
    currentSub = 'all';
    document.querySelectorAll('.industry-tabs button').forEach(function (b) { b.classList.remove('active'); });
    document.getElementById('tab-' + key).classList.add('active');
    document.getElementById('sub-tabs').classList.toggle('visible', key === 'dispatch');
    if (key === 'dispatch') {
      document.querySelectorAll('.sub-tabs button').forEach(function (b) { b.classList.remove('active'); });
      document.getElementById('sub-all').classList.add('active');
    }
    activeStep = 0;
    renderScript();
    renderDashboard();
  }

  function switchSub(key) {
    currentSub = key;
    document.querySelectorAll('.sub-tabs button').forEach(function (b) { b.classList.remove('active'); });
    document.getElementById('sub-' + key).classList.add('active');
    activeStep = 0;
    renderScript();
    renderDashboard();
  }

  function currentData() {
    if (current === 'dispatch' && currentSub !== 'all' && INDUSTRIES.dispatch.subs[currentSub]) {
      return INDUSTRIES.dispatch.subs[currentSub];
    }
    return INDUSTRIES[current];
  }

  function renderScript() {
    var d = currentData();
    var steps = d.script.concat([{
      step: '远', title: '主动与执行（愿景）', value: '从工具到 agent',
      demo: d.vision.active,
      talk: d.vision.exec + ' —— 从被动翻译，到主动提醒、替你执行'
    }]);
    var html = '';
    steps.forEach(function (s, i) {
      html += '<div class="step' + (i === activeStep ? ' active' : '') + '" onclick="setStep(' + i + ')">'
        + '<div class="head"><div class="tag">' + s.step + '</div>'
        + '<div><div class="title">' + s.title + '</div><div class="value">' + s.value + '</div></div></div>'
        + '<div class="body"><div class="demo">▶ ' + s.demo + '</div><div class="talk">💬 ' + s.talk + '</div></div>'
        + '</div>';
    });
    document.getElementById('script').innerHTML = html;
  }

  function setStep(i) { activeStep = i; renderScript(); }

  function renderDashboard() {
    var d = currentData();
    var langHtml = '';
    d.langs.forEach(function (l) {
      langHtml += '<div class="bar-row"><span class="lbl">' + l.name + '</span>'

        + '<span class="pct">' + l.pct + '%</span></div>';
    });
    var chipsHtml = '';
    d.brands.forEach(function (b) { chipsHtml += '<span class="chip">' + b + '</span>'; });

    document.getElementById('dashboard').innerHTML =
      '<div class="card"><h3>👥 今日游客语言分布</h3>' + langHtml + '</div>'
      + '<div class="card"><h3>📚 高频问答（实时调知识库检索）</h3><ul class="faq-list" id="faq-list">'
      + '<li class="hint">检索中…</li></ul></div>'
      + '<div class="card"><h3>📢 通知样例</h3><div style="color:#cbd8e4;">' + d.notice + '</div></div>'
      + '<div class="card"><h3>🏷 品牌词识别</h3><div class="chips">' + chipsHtml + '</div>'
      + '<div class="hint">游客说这些品牌词时，工牌识别并保留原词，不误翻</div></div>'
      + '<div class="card"><h3>📊 数据驱动的经营（三件事）</h3><div class="story-grid">'
      + '<div class="story"><div class="k">🌟 一线成长</div><div class="v">' + d.story.eval + '</div></div>'
      + '<div class="story"><div class="k">💡 产品创新</div><div class="v">' + d.story.innov + '</div></div>'
      + '<div class="story"><div class="k">📈 市场趋势</div><div class="v">' + d.story.trend + '</div></div>'
      + '</div></div>'
      + '<div class="card"><h3>🤖 这是 agent，不只是翻译机（愿景）</h3><div class="story-grid">'
      + '<div class="story"><div class="k">🎯 主动</div><div class="v">' + d.vision.active + '</div></div>'
      + '<div class="story"><div class="k">⚡ 执行</div><div class="v">' + d.vision.exec + '</div></div>'
      + '<div class="story"><div class="k">💬 对话</div><div class="v">多轮追问澄清，不是一问一答</div></div>'
      + '<div class="story"><div class="k">🧠 记忆</div><div class="v">' + d.vision.memory + '</div></div>'
      + '</div></div>';
    loadFaqAnswers(d);
  }

  function loadFaqAnswers(d) {
    var list = document.getElementById('faq-list');
    var promises = d.faqQuestions.map(function (q) {
      return fetch('/api/skb/answer?question=' + encodeURIComponent(q)
        + '&domain=vkb&customerId=' + customerId + '&storeId=' + storeId)
        .then(function (r) { return r.json(); })
        .then(function (res) { return { q: q, res: res }; })
        .catch(function () { return { q: q, res: { status: 'error' } }; });
    });
    Promise.all(promises).then(function (results) {
      var html = '';
      results.forEach(function (r) {
        var hit = r.res.status === 'ok';
        var tag = hit ? '<span class="tag hit">命中</span>' : '<span class="tag miss">未命中</span>';
        var answer = hit ? escapeHtml(r.res.answer) : '（未命中）';
        var src = hit && r.res.source_refs && r.res.source_refs.length
          ? '<div class="src">来源：' + escapeHtml(r.res.source_refs[0]) + '</div>' : '';
        html += '<li><div class="q">' + escapeHtml(r.q) + tag + '</div>'
          + '<div class="a">' + answer + '</div>' + src + '</li>';
      });
      list.innerHTML = html;
    });
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  renderScript();
  renderDashboard();
