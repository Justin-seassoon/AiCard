app:
  role: ${APP_ROLE:kb}

spring:
  application:
    name: aicard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aicard}
    username: ${DB_USER:aicard}
    password: ${DB_PASSWORD:aicard}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      max-lifetime: 300000
      idle-timeout: 60000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
azure:
  speech:
    key: ${AZURE_SPEECH_KEY:}
    region: ${AZURE_SPEECH_REGION:japaneast}
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    key: ${AZURE_OPENAI_KEY:}
    embedding-deployment: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-small}
translation:
  qualify:
    min-utt-duration-ms: 200        # spec 待定，联调可调
    numeric-filter: true
    whitelist: OK,Yes,No,Thank you,Thanks,Sorry,Hello,Hi,ありがとう,はい,いいえ,谢谢,是,不是,네,감사합니다
    brand-terms: Visa, Mastercard, JCB, American Express, Amex, UnionPay, 銀聯, Alipay, WeChat Pay, PayPay, Suica, PASMO, iPhone, iPad, Apple Watch, MacBook, Apple, Sony, Canon, Nikon, Panasonic, Dyson, ダイソン, 資生堂, Shiseido, SK-II, KOSE, コーセー, 雪肌精, ファンケル, オルビス, 任天堂, Switch, Booking.com, Agoda, Expedia, 楽天トラベル, じゃらん, Trip.com, Airbnb
aibridgex:
  base-url: ${AIBRIDGEX_BASE_URL:https://api.aibridgex.net/v1}
  key: ${AIBRIDGEX_KEY:}
  model: ${AIBRIDGEX_MODEL:deepseek-v4-flash}
ota:
  storage-dir: ${OTA_STORAGE_DIR:/data/ota}
  sign-secret: ${OTA_SIGN_SECRET:ota-demo-sign-secret}
  url-expires-sec: 3600
  public-base-url: ${OTA_PUBLIC_BASE_URL:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
