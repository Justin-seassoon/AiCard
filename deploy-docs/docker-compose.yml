version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicard-postgres
    environment:
      TZ: Asia/Tokyo
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: root
    ports:
      - "10.0.189.32:5432:5432"
    volumes:
      - /datasdb1/docker-env/postgresql16-vector-env/data:/var/lib/postgresql/data
    shm_size: 256m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    cpus: "2.0"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
